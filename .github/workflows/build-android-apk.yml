name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'components/**'
      - 'data/**'
      - 'services/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'App.tsx'
      - 'index.css'
      - 'types.ts'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p output-apk
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "output-apk/PortalMedico_v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/PortalMedico_latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalMedico-Android-APK
          path: output-apk/*.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" output-apk/*.apk --clobber || gh release create "v${VERSION}" output-apk/*.apk --title "Portal Médico v${VERSION}" --generate-notes || echo "Notice: Release upload skipped."
